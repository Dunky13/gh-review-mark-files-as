name: Publish Chrome Extension

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Check store status or upload and publish
        type: choice
        options: [status, publish]
        default: status
  push:
    branches:
      - main  # Change to your default branch name if different
    paths:
      - '*.js'
      - '*.html'
      - '*.css'
      - 'manifest.json'
      - 'images/**'
      - 'LICENSE'
      - 'LISENCE'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/**'

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build-and-publish:
    needs: test
    runs-on: ubuntu-24.04

    steps:
    # Step 1: Checkout the repository code
    - name: Checkout code
      uses: actions/checkout@v4

    - uses: pnpm/action-setup@v4
      with:
        version: 11

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 26.12.1
        cache: pnpm

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Check Chrome Web Store configuration
      env:
        PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
      run: ': "${PUBLISHER_ID:?Set the CHROME_PUBLISHER_ID repository variable to your Chrome Web Store publisher ID}"'

    # Step 3: Pack the Chrome Extension into a ZIP file
    - name: Pack Chrome Extension
      run: |
        mkdir -p build
        zip -r build/extension.zip manifest.json placement.js content.js background.js settings.js options.html options.js options.css images LICENSE

    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: chrome-extension.zip
        path: build/extension.zip

    - name: Upload and submit to Chrome Web Store (API v2)
      # Status mode never uploads or submits. Publishing preserves dashboard rollout settings.
      run: pnpm publish:cws ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'status' && '--status' || 'build/extension.zip' }}
      env:
        PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
        EXTENSION_ID: cdodhippkioagjgbchpljiboecdljklm
        CLIENT_ID: ${{ secrets.CLIENT }}
        CLIENT_SECRET: ${{ secrets.SECRET }}
        REFRESH_TOKEN: ${{ secrets.TOKEN }}
